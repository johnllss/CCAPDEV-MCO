<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register New User</title>
    <link rel="stylesheet" href="../../assets/css/registerstyle.css">
</head>


<body>
    <main class="container">

        <!-- For the left side -->
        <section class="auth-panel">

            <div class="auth-content">

                <div class="logo">
                    <span>RubberDuckCollective</span>
                </div>

                <h1>Create an account</h1>
                <p class="subtext">Enter your details to get started.</p>

                <form class="register-form">
                    <label>Email</label>
                    <input type="email" placeholder="johndoe@email.com">

                    <label>Username</label>
                    <input type="username" placeholder="john-doe">

                    <label>Password</label>
                    <div class="password-wrap">
                        <input type="password" placeholder="••••••••">
                        <!-- make sure to add onclick(); later to toggle password viewing-->
                    </div>

                    <div class="remember-forgot-container">
                        <label class="remember">
                            <input type="checkbox">
                            <!-- make sure to add onclick(); remember me functionality(optional)-->
                            Remember me
                        </label>
                        <a href="#">Forgot password?</a>
                    </div>

                </form>

            </div>

        </section>

        <section class="image-panel">
            <div class="quote-area">
                Have you talked to your rubber duck yet?
            </div>

        </section>
    </main>

</body>

</html>
