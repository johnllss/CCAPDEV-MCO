<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post - The Rubber Duck Forums</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/post.css">
    
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="website-name">
                <h1><a href="index.html">The Rubber Duck Forums</a></h1>
            </div>

            <div class="nav-btns">
                <ul>
                    <li><input type="text" placeholder="Search..."></li>
                    <li><a href="index.html">Home</a></li> <!-- ideally, logo part -->
                    <li><a href="login.html">Login</a></li>
                    <li><a href="register.html">Register</a></li>
                    <li><a href="profile.html">Profile</a></li> <!-- ideally, just an icon for profile -->
                    <li><a href="logout.html">Logout</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <div class="create-post-container">
            <div class="create-post-box">
                <div class="create-post-content-container">
                    <h2 class="create-post-header">Create a Post</h2>
                    <div class="create-post-title-container">
                        <input id="title-input" class="create-post-title" type="text" placeholder="Title (required)" maxlength="150">
                        <div id="char-ctr" class="char-limit">0/150</div>
                    </div>
                    <div class="create-post-body-container">
                        <textarea class="create-post-body" placeholder="Body"></textarea>
                    </div>
                </div>
                <div class="create-post-file-upload">
                    <label>
                        <input id="file-upload" type="file" accept="image/png, image/jpeg" hidden>
                        <img class="image-icon" src="../../assets/images/image-outline.png">
                    </label>
                    <span id="file-upload-name"></span>
                </div>
            </div>
        </div>
        <div class="create-post-actions-container">
            <button id="cancel-button" class="create-post-cancel-button">Cancel</button>
            <button id="publish-button" class="create-post-publish-button">Publish</button>
        </div>
    </main>
    
    <footer>
    </footer>

    <script src="../../assets/js/post.js"></script>

</body>
</html>
