<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="/assets/css/editprofile.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <div class="website-name">
                <h1 class="webnameheader"><a href="index.html">The Rubber Duck Forums</a></h1>
            </div>

            <div class="nav-btns">
                <ul>
                    <li><input type="text" placeholder="Search..."></li>
                    <li><a href="index.html">Home</a></li> <!-- ideally, logo part -->
                    <li><a href="login.html">Login</a></li>
                    <li><a href="register.html">Register</a></li>
                    <li><a href="profile.html">Profile</a></li> <!-- ideally, just an icon for profile -->
                    <li><a href="logout.html">Logout</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <div class="profile-container">
            <h1>Edit Profile</h1>

            <form id="editProfileForm">

                <!-- starting with the name, and photo-->

                <div class="profile-header-container">
                    <div class="profile-left">
                        <img id="profilepreview" src="/assets/images/sample.jpg" alt="dp">

                        <label class="uploadbtn">
                            Change Photo
                            <input type="file" id="profile-img" accept="image/*" hidden>
                        </label>

                        <input type="text" id="user-quote" placeholder="Quote" value="Quote">

                    </div>

                    <div class="profile-right">
                        <input type="text" id="username" value="Username" disabled>
                        <!-- for now keep this disabled, later on add functionality for every 30days allow to change or somethin-->

                        <input type="text" id="fullname" value="Full Name" required>
                        <!-- if text is empty make sure to not allow user to save-->
                    </div>
                </div>

                <!-- for the about me section -->

                <section class="profile-section">
                    <h2>About Me</h2>
                    <textarea id="aboutme" rows="5" cols="100"></textarea>z
                </section>

                <!-- for the save and cancel buttons -->
                <div class="form-buttons">
                    <button type="submit" class="editbtn">Save Changes</button>
                    <a href="/pages/static-html/profile.html" class="cancelbtn">Cancel</a>
                </div>
            </form>
        </div>
    </main>

    <script src="/assets/js/edit-profile.js"></script>
</body>

</html>
